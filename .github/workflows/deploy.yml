name: Sync LICENSE from Legal Engine

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [update-legal]

permissions:
  contents: write

jobs:
  sync-license:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main repo
      - name: Checkout Repo
        uses: actions/checkout@v5

      # 2. Checkout legal-engine
      - name: Get Legal Engine
        uses: actions/checkout@v5
        with:
          repository: Adel-EUAI/legal-engine
          path: legal-engine
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      # 3. Copy LICENSE based on config
      - name: Copy LICENSE from Config
        run: |
          CONFIG_PATH="./legal.config.json"
          # استخراج نام فایل از کانفیگ
          FILE=$(jq -r '.legal_files[0]' "$CONFIG_PATH")
            
          # آدرس درست فایل که در مخزن legal-engine کپی شده است
          SOURCE_PATH="legal-engine/src/$FILE"

          if [ ! -f "$SOURCE_PATH" ]; then
            echo "❌ File not found at: $SOURCE_PATH"
            exit 1
          fi

          # کپی به ریشه مخزن جاری
          cp -f "$SOURCE_PATH" ./LICENSE.md

      # 4. Commit & Push if changed
      - name: Commit LICENSE
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          if git diff --quiet LICENSE.md; then
            echo "No changes"
          else
            git add LICENSE.md
            git commit -m "chore: sync LICENSE.md from legal-engine"
            git push origin main
          fi
